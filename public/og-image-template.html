<!-- Simple OG Image HTML Template -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 60px;
            background: #111111;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            width: 1200px;
            height: 630px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: #333;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 72px;
            margin: 0 0 20px 0;
            font-weight: 600;
        }
        p {
            font-size: 32px;
            color: #d0d0d0;
            margin: 0;
            max-width: 800px;
        }
        .url {
            position: absolute;
            bottom: 60px;
            right: 60px;
            font-size: 24px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="logo">EO</div>
    <h1>Emmanuel Otoo</h1>
    <p>Software Engineer</p>
    <div class="url">emmanuelotoo.github.io</div>
</body>
</html>
