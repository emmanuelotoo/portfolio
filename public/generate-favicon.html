<!DOCTYPE html>
<html>
<head>
    <style>
        canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <canvas id="favicon" width="32" height="32"></canvas>
    <script>
        const canvas = document.getElementById('favicon');
        const ctx = canvas.getContext('2d');
        
        // Dark background with rounded corners
        ctx.fillStyle = '#111111';
        ctx.fillRect(0, 0, 32, 32);
        
        // White text "EO"
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('EO', 16, 17);
        
        // Convert to data URL and create download link
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'favicon-32x32.png';
        link.href = dataURL;
        document.body.appendChild(link);
        
        console.log('Favicon generated. Right-click canvas and save as image.');
    </script>
</body>
</html>
